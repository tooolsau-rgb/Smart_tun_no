
name: Build SmartClaw APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      PIP_BREAK_SYSTEM_PACKAGES: '1'
      ACCEPT_ANDROID_SDK_LICENSE: '1'

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk \
            python3-pip python3-venv \
            autoconf automake libtool pkg-config \
            zlib1g-dev libffi-dev libssl-dev \
            cmake libncurses-dev \
            libsqlite3-dev liblzma-dev \
            libbz2-dev libreadline-dev \
            libgdbm-dev

      - name: Configure Java 17
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"

      - name: Install Buildozer
        run: |
          python3 -m pip install --user \
            --break-system-packages \
            --ignore-installed \
            buildozer \
            cython==0.29.34 \
            setuptools \
            wheel

          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Accept Android SDK licenses
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          test -f "$SDKMANAGER"

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;37.0.0"

          test -f "$ANDROID_HOME/build-tools/37.0.0/aidl"

      - name: Configure Buildozer SDK
        working-directory: android
        run: |
          test -f buildozer.spec

          sed -i \
            '/^[[:space:]]*android.sdk_path[[:space:]]*=/d' \
            buildozer.spec

          sed -i \
            '/^\[app\]/a android.sdk_path = /usr/local/lib/android/sdk' \
            buildozer.spec

          grep '^android.sdk_path' buildozer.spec

      - name: Build APK
        working-directory: android
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartClaw-debug-apk
          path: android/bin/*.apk
          if-no-files-found: error
          retention-days: 30
